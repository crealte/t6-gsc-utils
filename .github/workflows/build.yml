name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_description:
        description: 'Release Title/Description'
        required: false
        default: 'Workflow Dispatch'

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Check out files
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate project files
        run: tools/premake5 vs2022

      - name: Build ${{matrix.configuration}} binaries
        run: msbuild /m /v:minimal /p:Configuration=${{matrix.configuration}} /p:PlatformTarget=x86 build/t6-gsc-utils.sln

      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.configuration}}-binaries
          path: build/bin/${{matrix.configuration}}/t6-gsc-utils.dll

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Run only on tags or manual triggers
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Release-binaries/t6-gsc-utils.dll
            Debug-binaries/t6-gsc-utils.dll
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('{0}-run-{1}', github.ref_name, github.run_number) || github.ref_name }}
          name: >
            ${{ github.event_name == 'workflow_dispatch' 
                && format('{0} (Run {1})', github.event.inputs.release_description, github.run_number) 
                || format('Build {0}', github.ref_name) }}
          draft: false
          prerelease: false
